<h2 mat-dialog-title>{{ "info.storage.guidelines.title" | translate }}</h2>
<mat-dialog-content>
  <p>{{ "info.storage.guidelines.content" | translate }}</p>
  <p>
    <a
      href="https://confluence.medunigraz.at/spaces/ITKB/pages/64392119/Richtlinie+f%C3%BCr+Datenschutz+und+IT-Sicherheit"

      {{ "info.storage.guidelines.links.dataProtection" | translate }}
